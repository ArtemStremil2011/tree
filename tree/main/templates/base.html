<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Семейное древо{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a472a 0%, #2d5a3a 100%);
            min-height: 100vh;
            padding-top: 80px;
        }

        .fixed-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-menu {
            display: flex;
            justify-content: center;
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            flex-wrap: wrap;
        }

        .nav-menu a, .nav-menu span {
            color: white !important;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-menu a {
            cursor: pointer;
        }

        .nav-menu a:hover {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700 !important;
            transform: translateY(-2px);
        }

        .user-info {
            color: #ffd700 !important;
            border-left: 1px solid rgba(255, 215, 0, 0.3);
        }

        main {
            min-height: calc(100vh - 80px);
            width: 100%;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem;
            z-index: 2000;
            animation: slideDown 0.3s ease;
        }

        .modal.show {
            display: block;
        }

        .modal-content {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            border: 3px solid #ffd700;
        }

        .modal-content p {
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
            color: #2c3e50;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .modal-btn {
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }

        .modal-btn.confirm {
            background: #e74c3c;
            color: white;
        }

        .modal-btn.confirm:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
        }

        .modal-btn.cancel {
            background: #95a5a6;
            color: white;
        }

        .modal-btn.cancel:hover {
            background: #7f8c8d;
            transform: translateY(-2px);
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            body {
                padding-top: 120px;
            }
            .nav-menu {
                gap: 0.5rem;
                flex-direction: column;
                align-items: center;
            }
            .user-info {
                border-left: none;
                border-top: 1px solid rgba(255, 215, 0, 0.3);
                margin-top: 0.5rem;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="fixed-header">
        <div class="nav-menu">
            <a href="{% url 'home' %}"><span>🏠</span> Главная</a>
            
            {% if user.is_authenticated %}
                <a href="{% url 'person_list' %}"><span>🌳</span> Моё древо</a>
                <span class="user-info">👤 {{ user.username }}</span>
                <a onclick="showLogoutModal()">
                    <span>🚪</span> Выйти
                </a>
            {% else %}
                <a href="{% url 'users:login' %}"><span>🔐</span> Войти</a>
                <a href="{% url 'users:register' %}"><span>📝</span> Регистрация</a>
            {% endif %}
        </div>
    </div>

    <div class="modal" id="logoutModal">
        <div class="modal-content">
            <p>🚪 Выйти из аккаунта?</p>
            <div class="modal-buttons">
                <form action="{% url 'users:logout' %}" method="post" style="flex: 1;">
                    {% csrf_token %}
                    <button type="submit" class="modal-btn confirm">Да, выйти</button>
                </form>
                <button class="modal-btn cancel" onclick="hideLogoutModal()">Отмена</button>
            </div>
        </div>
    </div>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script>
        function showLogoutModal() {
            document.getElementById('logoutModal').classList.add('show');
        }

        function hideLogoutModal() {
            document.getElementById('logoutModal').classList.remove('show');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('logoutModal');
            if (event.target === modal) {
                hideLogoutModal();
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                hideLogoutModal();
            }
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
